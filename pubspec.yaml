name: expense_receipt_tracker
description: "A production-ready Flutter app for scanning receipts, OCR extraction, regex parsing, and SQLite expense tracking."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '^3.3.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.14.0
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
